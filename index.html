<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Huevane 綄彩</title>
<meta name="description" content="Huevane 綄彩：一面会转向的染色风向标。MindResort 心境度假村的出品方。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Noto+Serif+SC:wght@400;900&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
/* Layout: a bolt of raw silk — dye ribbons drift across the whole sheet like cloth hung to dry; the name is stamped on top like a dyer's seal, dye swatches along the hem */
:root{
  --silk:#f1ece1; --silk-2:#e6dfcf; --ink:#1d1a22; --muted:#6e675c; --seal:#b3342a;
  --indigo:#2c4a7a; --madder:#b8443a; --gardenia:#e2a83a; --sappan:#8c2f55; --verdigris:#3f8a7c; --murasaki:#5d4486;
  --f-latin:"Instrument Serif","Cormorant Garamond",Georgia,serif;
  --f-cjk:"Noto Serif SC","Songti SC","STSong",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--silk)}
body{margin:0;background:var(--silk);color:var(--ink);font-family:var(--f-cjk);overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--seal);outline-offset:3px}

#cloth{position:fixed;inset:0;width:100%;height:100%;display:block}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;
  background-image:repeating-linear-gradient(0deg,rgba(80,60,30,.035) 0 1px,transparent 1px 3px),repeating-linear-gradient(90deg,rgba(80,60,30,.03) 0 1px,transparent 1px 4px)}

.page{position:relative;min-height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:24px;max-width:1180px;margin:0 auto;padding-block:22px 26px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top a{text-decoration:none}
.top a:hover{color:var(--ink)}

.mark{align-self:center;display:grid;gap:18px;justify-items:start}
.name{margin:0;font-family:var(--f-latin);font-weight:400;font-size:clamp(76px,17vw,220px);line-height:.82;letter-spacing:-.035em;color:var(--ink)}
.name i{font-style:italic}
.row{display:flex;align-items:center;gap:clamp(14px,2.4vw,28px);flex-wrap:wrap}
.seal{display:grid;place-items:center;width:clamp(78px,10vw,108px);aspect-ratio:1;max-width:100%;background:var(--seal);color:var(--silk);border-radius:6px;font-family:var(--f-cjk);font-weight:900;font-size:clamp(28px,3.6vw,40px);line-height:1.02;writing-mode:vertical-rl;letter-spacing:.06em;box-shadow:inset 0 0 0 3px var(--seal),inset 0 0 0 5px rgba(241,236,225,.55);transform:rotate(-3deg)}
.gloss{display:grid;gap:6px;max-width:34ch}
.gloss p{margin:0;font-size:clamp(15px,1.6vw,17px);line-height:1.85;text-wrap:pretty}
.gloss .def{font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;color:var(--muted);line-height:1.7}
.gloss .def b{font-weight:400;color:var(--ink)}

.hem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px 32px;align-items:end;border-top:1px solid rgba(29,26,34,.25);padding-top:18px}
.swatches{display:flex;gap:10px;flex-wrap:wrap;list-style:none;margin:0;padding:0}
.swatches li{display:grid;gap:4px;justify-items:start;font-size:13px}
.swatches span{display:block;width:44px;height:18px;border-radius:2px;background:var(--c)}
.swatches small{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.houses{display:grid;gap:8px;justify-items:end;text-align:right}
.houses .k{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.houses a{display:flex;align-items:baseline;gap:12px;text-decoration:none;font-size:18px;padding:4px 0;border-bottom:1px solid transparent}
.houses a:hover{border-bottom-color:var(--ink)}
.houses a em{font-family:var(--f-latin);font-style:italic;font-size:22px}
.houses a small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em}

@media (max-width:760px){
  .hem{grid-template-columns:minmax(0,1fr)}
  .houses{justify-items:start;text-align:left}
  .swatches span{width:36px}
}
</style>
</head>
<body>
<canvas id="cloth" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="page">
  <header class="top">
    <span>Huevane · 綄彩</span>
    <a href="https://github.com/Huevane" rel="noopener">github.com/Huevane</a>
  </header>

  <main class="mark">
    <h1 class="name">Hue<i>vane</i></h1>
    <div class="row">
      <div class="seal" aria-label="印章：綄彩">綄彩</div>
      <div class="gloss">
        <p>一面会转向的染色风向标。风往哪边吹，颜色就往哪边走。</p>
        <p class="def"><b>hue</b> 色相 ＋ <b>vane</b> 风向标<br><b>綄</b> 丝线 ＋ <b>彩</b> 染色</p>
      </div>
    </div>
  </main>

  <footer>
    <div class="hem">
      <ul class="swatches" aria-label="染料">
        <li style="--c:var(--indigo)"><span></span>靛青<small>INDIGO</small></li>
        <li style="--c:var(--madder)"><span></span>茜红<small>MADDER</small></li>
        <li style="--c:var(--gardenia)"><span></span>栀黄<small>GARDENIA</small></li>
        <li style="--c:var(--sappan)"><span></span>苏枋<small>SAPPAN</small></li>
        <li style="--c:var(--verdigris)"><span></span>铜绿<small>VERDIGRIS</small></li>
        <li style="--c:var(--murasaki)"><span></span>紫草<small>GROMWELL</small></li>
      </ul>
      <nav class="houses" aria-label="旗下">
        <span class="k">驻地 · Residents</span>
        <a href="https://mindresort.github.io/"><em>MindResort</em>心境度假村<small>→</small></a>
        <a href="https://wongary.github.io/"><em>WonGary</em>个人站<small>→</small></a>
      </nav>
    </div>
    <div class="foot" style="margin-top:16px"><span>© 2026 Huevane 綄彩</span><span>移动鼠标或手指，改变风向</span></div>
  </footer>
</div>

<script>
(()=>{
  const cv=document.getElementById('cloth'),ctx=cv.getContext('2d');
  const css=getComputedStyle(document.documentElement);
  const dyes=['--indigo','--madder','--gardenia','--sappan','--verdigris','--murasaki'].map(v=>css.getPropertyValue(v).trim());
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W=0,H=0,dpr=1,t=0,wind=0.35,windT=0.35,last=0;
  // each ribbon: base height, amplitude, frequencies, phase, width, colour
  const R=dyes.map((c,i)=>({c,y:.14+i*.14+(i%2?.03:-.02),a:.06+.025*(i%3),f1:1.1+.37*i,f2:2.3+.21*i,p:i*1.7,w:.05+.018*((i*7)%4),s:.6+.13*i}));
  function size(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);}
  function draw(){
    ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation='multiply';
    const N=Math.max(40,Math.round(W/14)),narrow=W<760;
    for(const r of R){
      const top=[],bot=[];
      for(let k=0;k<=N;k++){
        const u=k/N,x=u*W;
        const ph=t*r.s*wind;
        const y=(r.y+r.a*Math.sin(u*r.f1*Math.PI*2+r.p+ph)+r.a*.45*Math.sin(u*r.f2*Math.PI*2-r.p*.7+ph*1.6))*H;
        // ribbon twists: width swells and pinches like hanging silk
        const tw=Math.sin(u*Math.PI*(1.4+r.f1*.3)+r.p*1.3+ph*.8);
        const w=r.w*H*(narrow?.75:1)*(.18+.82*Math.abs(tw));
        top.push([x,y-w/2]);bot.push([x,y+w/2]);
      }
      ctx.beginPath();ctx.moveTo(top[0][0],top[0][1]);
      for(let k=1;k<top.length;k++){const a=top[k-1],b=top[k];ctx.quadraticCurveTo(a[0],a[1],(a[0]+b[0])/2,(a[1]+b[1])/2);}
      for(let k=bot.length-1;k>=0;k--)ctx.lineTo(bot[k][0],bot[k][1]);
      ctx.closePath();
      ctx.globalAlpha=.46;ctx.fillStyle=r.c;ctx.fill();
      ctx.globalAlpha=.22;ctx.lineWidth=1;ctx.strokeStyle=r.c;ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
  function frame(now){
    const dt=Math.min(50,now-(last||now));last=now;
    wind+=(windT-wind)*.04;t+=dt/1000;
    draw();requestAnimationFrame(frame);
  }
  const steer=x=>{windT=.15+1.1*(x/Math.max(1,innerWidth));};
  addEventListener('pointermove',e=>steer(e.clientX),{passive:true});
  addEventListener('touchmove',e=>{if(e.touches[0])steer(e.touches[0].clientX);},{passive:true});
  addEventListener('resize',()=>{size();draw();});
  size();t=2.4;draw();
  if(!reduce)requestAnimationFrame(frame);
})();
</script>
</body>
</html>
